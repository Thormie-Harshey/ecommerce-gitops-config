# Staging: the base, in the staging namespace, with staging's own password.
# CI updates the image tags below after every successful build.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: staging
resources:
  - ../../base
  - postgres-sealedsecret.yaml
  - traffic-generator.yaml
images:
  - name: thormie/ecommerce-gateway
    newTag: sha-a15fa9d
  - name: thormie/ecommerce-product
    newTag: sha-a15fa9d
  - name: thormie/ecommerce-order
    newTag: sha-a15fa9d
