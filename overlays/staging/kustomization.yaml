# Staging: the base, in the staging namespace, with staging's own password.
# CI updates the image tags below after every successful build.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: staging
resources:
  - ../../base
  - postgres-sealedsecret.yaml
  - traffic-generator.yaml
images:
  - name: thormie/ecommerce-gateway
    newTag: sha-929b453
  - name: thormie/ecommerce-product
    newTag: sha-929b453
  - name: thormie/ecommerce-order
    newTag: sha-929b453
# ALERT DRILL: wrong product address, to make orders fail. Revert after testing.
patches:
  - target:
      kind: Deployment
      name: order
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: order
      spec:
        template:
          spec:
            containers:
              - name: order
                env:
                  - name: PRODUCT_SERVICE_URL
                    value: http://product-missing:3001
