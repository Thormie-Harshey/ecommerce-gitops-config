# Jaeger: distributed tracing across the three services.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jaeger
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://jaegertracing.github.io/helm-charts
      chart: jaeger
      targetRevision: 4.16.1
      helm:
        releaseName: jaeger
        valueFiles:
          - $values/monitoring/jaeger-values.yaml
    - repoURL: https://github.com/Thormie-Harshey/ecommerce-gitops-config.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
