# Sealed Secrets for the monitoring stack: Grafana login and Slack webhooks.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Thormie-Harshey/ecommerce-gitops-config.git
    targetRevision: main
    path: monitoring/secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
