# Prometheus, Grafana and Alertmanager. Chart from the internet,
# settings from this repo (multi-source).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 93.2.0
      helm:
        releaseName: kps
        valueFiles:
          - $values/monitoring/kube-prometheus-stack-values.yaml
    - repoURL: https://github.com/Thormie-Harshey/ecommerce-gitops-config.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
