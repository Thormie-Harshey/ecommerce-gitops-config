# Six alert rules for the e-commerce platform, in staging and production.
# Severity decides the Slack channel: critical or warning.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ecommerce-alerts
  namespace: monitoring
spec:
  groups:
    - name: ecommerce.rules
      rules:
        - alert: ServiceDown
          expr: |
            up{namespace=~"staging|production", job=~"gateway|order|product"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.job }} is down"
            description: "Prometheus cannot reach {{ $labels.job }} in {{ $labels.namespace }} for 1 minute."
            runbook_url: https://github.com/Thormie-Harshey/ecommerce-gitops-config/blob/main/docs/runbooks/service-down.md

        - alert: HighErrorRate
          expr: |
            sum by (namespace, job) (rate(http_request_duration_seconds_count{namespace=~"staging|production", status_code=~"5.."}[5m]))
              / sum by (namespace, job) (rate(http_request_duration_seconds_count{namespace=~"staging|production"}[5m])) > 0.05
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.job }}: more than 5% of requests are failing"
            description: "{{ $labels.job }} in {{ $labels.namespace }} returned 5xx for {{ $value | humanizePercentage }} of requests over 5 minutes."
            runbook_url: https://github.com/Thormie-Harshey/ecommerce-gitops-config/blob/main/docs/runbooks/high-error-rate.md

        - alert: HighLatencyP99
          expr: |
            histogram_quantile(0.99, sum by (namespace, job, le) (rate(http_request_duration_seconds_bucket{namespace=~"staging|production"}[5m]))) > 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.job }}: p99 latency above 1 second"
            description: "The slowest 1% of {{ $labels.job }} requests in {{ $labels.namespace }} take {{ $value | humanizeDuration }} or more."
            runbook_url: https://github.com/Thormie-Harshey/ecommerce-gitops-config/blob/main/docs/runbooks/high-latency.md

        - alert: PodCrashLooping
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace=~"staging|production"}[1h]) > 3
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.pod }} is crash looping"
            description: "Container {{ $labels.container }} in {{ $labels.pod }} restarted {{ $value | humanize }} times in the last hour."
            runbook_url: https://github.com/Thormie-Harshey/ecommerce-gitops-config/blob/main/docs/runbooks/pod-crash-looping.md

        - alert: NodeNotReady
          expr: |
            kube_node_status_condition{condition="Ready", status="true"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Node {{ $labels.node }} is not ready"
            description: "Node {{ $labels.node }} has not reported Ready for 2 minutes. Pods on it may not run."
            runbook_url: https://github.com/Thormie-Harshey/ecommerce-gitops-config/blob/main/docs/runbooks/node-not-ready.md

        - alert: DiskSpaceLow
          expr: |
            100 * node_filesystem_avail_bytes{mountpoint="/var"} / node_filesystem_size_bytes{mountpoint="/var"} < 10
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Disk on {{ $labels.instance }} is below 10% free"
            description: "Only {{ $value | humanize }}% free on /var. Images, logs and Loki data may stop being written."
            runbook_url: https://github.com/Thormie-Harshey/ecommerce-gitops-config/blob/main/docs/runbooks/disk-space-low.md
