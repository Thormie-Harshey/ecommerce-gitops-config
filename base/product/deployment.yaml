# Runs the product service. Readiness uses /health (checks Postgres and Redis);
# liveness only checks the port, so a database outage does not cause restarts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product
  labels:
    app: product
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product
  template:
    metadata:
      labels:
        app: product
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: product
          image: thormie/ecommerce-product:sha-929b453
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: REDIS_URL
              value: redis://redis:6379
            - name: CACHE_TTL_SECONDS
              value: "60"
            - name: PGHOST
              value: postgres
            - name: PGUSER
              value: ecommerce
            - name: PGDATABASE
              value: ecommerce
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: OTEL_SERVICE_NAME
              value: product
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
