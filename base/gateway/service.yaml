# Gives the gateway pods a fixed internal address: http://gateway:3000
# The label and port name let Prometheus find it (ServiceMonitor).
apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  selector:
    app: gateway
  ports:
    - name: http
      port: 3000
      targetPort: 3000
